<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books (JSON + fetch)</title>
</head>
<body>
  <h1>Books</h1>

  <h2>Title of the first book</h2>
  <p id="firstTitle"></p>

  <h2>Author of the second book</h2>
  <p id="secondAuthor"></p>

  <h2>Genres</h2>
  <ul id="genreList"></ul>

  <p id="error" role="alert"></p>

  <script>
    var errorBox = document.getElementById("error");

   
    fetch("books.json")
      .then(function (response) {
        // Check that the request worked
        if (!response.ok) {
          throw new Error("Could not load books.json (status " + response.status + ")");
        }
        return response.json();   
      })
      .then(function (data) {
        var books = data.books;

        
        document.getElementById("firstTitle").textContent = books[0].title;

        
        document.getElementById("secondAuthor").textContent = books[1].author;

        
        var list = document.getElementById("genreList");
        for (var i = 0; i < books.length; i++) {
          var li = document.createElement("li");
          li.textContent = books[i].title + " — " + books[i].genres.join(", ");
          list.appendChild(li);
        }
      })
      .catch(function (error) {
        
        errorBox.textContent = "Sorry, the book data could not be loaded. " + error.message;
      });
  </script>
</body>
</html>
